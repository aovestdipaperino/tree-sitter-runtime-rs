[package]
name = "tree-sitter-runtime-rs"
version = "0.0.0"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
edition = "2024"
description = "The tree-sitter runtime, ported from C to Rust (work in progress)"
license = "MIT"
repository = "https://github.com/aovestdipaperino/tree-sitter-runtime-rs"
publish = false

[features]
# Builds the renamed C reference (needs `patch` and the repo's `src/`) that the tests and the
# harness compare against. Off for consumers: the shipped crate is Rust plus one 15-line C shim.
reference = []

[lib]
crate-type = ["rlib", "staticlib"]

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter-lite-rs = "0.1"
tree-sitter-language = "0.1"
