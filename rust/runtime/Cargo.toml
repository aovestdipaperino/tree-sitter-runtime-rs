[package]
name = "tree-sitter-runtime-rs"
version = "0.1.0"
authors = ["Enzo Lombardi <enzinol@gmail.com>"]
edition = "2024"
description = "The tree-sitter C runtime (v0.27.2) ported to Rust, exporting the same C ABI"
readme = "README.md"
keywords = ["tree-sitter", "parser", "incremental", "ffi"]
categories = ["parsing", "external-ffi-bindings"]
include = ["/src/**", "/c/**", "/build.rs", "/Cargo.toml", "/README.md", "/LICENSE"]
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/aovestdipaperino/tree-sitter-runtime-rs"
publish = false

[features]
# Builds the renamed C reference (needs `patch` and the repo's `src/`) that the tests and the
# harness compare against. Off for consumers: the shipped crate is Rust plus one 15-line C shim.
reference = []

[lib]
crate-type = ["rlib", "staticlib"]

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter-lite-rs = "0.1"
tree-sitter-language = "0.1"
